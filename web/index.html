<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>impromptu studio</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #0b0e0f; color: #e5e7eb; }
    button, input { padding: .55rem .7rem; border-radius: .35rem; border: 1px solid #4b5563; background: #1f2937; color: inherit; }
    button:hover { border-color: #5af78e; }
    li { margin: .5rem 0; }
    /* The prompter scrolls itself; a fixed height keeps the reading position
       centred rather than letting the page grow without bound. */
    #prompt { height: 18rem; overflow-y: auto; font-size: 2rem; line-height: 1.4;
              white-space: pre-wrap; padding: .75rem; border: 1px solid #374151;
              border-radius: .5rem; background: #111827; }
    /* Words already spoken, per the voice matcher. */
    #prompt .spoken { color: #5af78e; }
    .muted { color: #9ca3af; } .note { color: #9ca3af; font-size: .85rem; margin: .4rem 0; }
    #renders li { font-family: ui-monospace, monospace; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>impromptu studio</h1>
  <p id="health" class="muted">checking studio…</p>

  <section>
    <h2>Productions</h2>
    <form id="new-production">
      <input id="name" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,127}" placeholder="chapter-1">
      <button>Create</button>
    </form>
    <ul id="productions"></ul>
  </section>

  <section>
    <h2>Teleprompter</h2>
    <div id="prompt">Choose a production to load its script.</div>
    <p>
      <button id="pause">Pause</button>
      <button id="resume">Resume</button>
      <button id="follow">Follow my voice</button>
      <button id="unfollow">Manual</button>
      <button id="resync">Resync</button>
    </p>
    <p id="state" class="muted"></p>
    <p id="voice-note" class="note">
      Voice following scrolls as you speak and keeps its place if you go off
      script. Manual speed or seek overrides it.
    </p>
  </section>

  <section>
    <h2>Render queue</h2>
    <ul id="renders"></ul>
  </section>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
